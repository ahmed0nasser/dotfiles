set-option -sa terminal-overrides ",xterm*:Tc"
# Enable extended-keys
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

# Enable mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ====================================================================
# TMUX-SENSIBLE
# ====================================================================
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on
# ====================================================================

# ====================================================================
# HELIX-STYLE SELECTION MODE CONFIGURATION
# ====================================================================
# Use vi-mode as our baseline layout
set-window-option -g mode-keys vi

# Selection and Yanking
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Helix line selection: 'x' selects the current line
bind-key -T copy-mode-vi x send-keys -X select-line

# Helix collapse selection: ',' clears the current selection
bind-key -T copy-mode-vi , send-keys -X clear-selection

# Helix 'g' (Goto) key Chords
bind-key -T copy-mode-vi g switch-client -T helix-goto
bind-key -T helix-goto h send-keys -X start-of-line       # gh -> line start
bind-key -T helix-goto l send-keys -X end-of-line         # gl -> line end
bind-key -T helix-goto g send-keys -X history-top         # gg -> top of buffer
bind-key -T helix-goto e send-keys -X history-bottom      # ge -> bottom of buffer
bind-key -T helix-goto s send-keys -X back-to-indentation # gs -> first non-blank char

# Helix 'z' (View) key Chords
bind-key -T copy-mode-vi z switch-client -T helix-view
bind-key -T helix-view c send-keys -X middle-of-screen     # zc -> center cursor (middle)
bind-key -T helix-view t send-keys -X top-of-screen        # zt -> top of screen
bind-key -T helix-view b send-keys -X bottom-of-screen     # zb -> bottom of screen
# ====================================================================

# Create panes from CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Source theme
source-file ~/.config/tmux/konsole.tmux.conf
