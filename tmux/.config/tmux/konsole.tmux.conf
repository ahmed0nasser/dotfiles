# =============================================================================
# tmux-dark-theme.conf — Dark theme for Konsole terminal
# Source from ~/.tmux.conf with: source-file ~/.config/tmux/tmux-dark-theme.conf
# =============================================================================

# --- Pane borders ---
set -g pane-border-style          "fg=#3b4252"
set -g pane-active-border-style   "fg=#81a1c1"

# --- Status bar base ---
set -g status                     on
set -g status-position            bottom
set -g status-interval            5
set -g status-style               "bg=#1e2228,fg=#d8dee9"

# --- Left: session name ---
set -g status-left-length         30
set -g status-left                "#[bg=#81a1c1,fg=#1e2228,bold] #S #[bg=#1e2228,fg=#81a1c1]"

# --- Right: prefix indicator + date + time ---
set -g status-right-length        60
set -g status-right               "#{?client_prefix,#[fg=#bf616a bold] P #[nobold],}#[bg=#1e2228 fg=#8fbcbb]%a %d %b#[fg=#4c566a]   #[fg=#ebcb8b]%I:%M %p "

# --- Window list (center) ---
set -g status-justify             left

# Inactive window tab
set -g window-status-format       "#[fg=#4c566a] #I #[fg=#616e88]#W "

# Active window tab
set -g window-status-current-format \
  "#[fg=#1e2228,bg=#5e81ac] #I #[fg=#eceff4,bg=#3b4252,bold] #W #[fg=#3b4252,bg=#1e2228]"

# Window with activity
set -g window-status-activity-style "fg=#ebcb8b,bg=#1e2228"

# --- Message / command prompt ---
set -g message-style              "bg=#3b4252,fg=#88c0d0,bold"
set -g message-command-style      "bg=#3b4252,fg=#d08770"

# --- Misc ---
set -g mode-style                 "bg=#4c566a,fg=#eceff4"   # copy-mode highlight
