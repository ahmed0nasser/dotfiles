# =============================================================================
# Night Owl tmux Theme
# Inspired by Sarah Drasner's Night Owl VS Code theme
# =============================================================================

# --- Palette ---
# bg:#011627  surface:#0d2137  border:#1d3b53  subtle:#1e4063
# fg:#d6deeb  comment:#637777
# cyan:#7fdbca  blue:#82aaff  purple:#c792ea
# green:#addb67  yellow:#ffcb8b  orange:#f78c6c  red:#ff5874

# =============================================================================
# General Settings
# =============================================================================

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-position bottom

set -g status-style "bg=#011627,fg=#d6deeb"

# =============================================================================
# Status Bar — Left
# =============================================================================

set -g status-left-length 80
set -g status-left "#[bg=#7fdbca,fg=#011627,bold] 󱂬 #S #[bg=#1d3b53,fg=#7fdbca]#[bg=#1d3b53,fg=#82aaff] 󰨈 #(whoami) #[bg=#011627,fg=#1d3b53]#[bg=#011627,fg=#637777]  "

# =============================================================================
# Status Bar — Right
# =============================================================================
#
# Prefix conditional: both branches are fully self-contained.
# true branch : yellow pill + E0BA cap back to status bg
# false branch: empty — the shared E0BA after the conditional is removed;
#               instead the border pill starts with its own E0BA cap.

set -g status-right-length 80
set -g status-right "#[fg=#ffcb8b,bold] #{?client_prefix, } #[fg=#1d3b53]#[bg=#1d3b53,fg=#d6deeb] %a %d %b #[fg=#637777]#[fg=#82aaff] %-I:%M %p #[bg=#1d3b53,fg=#7fdbca]#[bg=#7fdbca,fg=#011627,bold] 󰍹 #h "

# =============================================================================
# Windows / Tabs
# =============================================================================

set -g window-status-separator ""

set -g window-status-format "#[bg=#0d2137,fg=#637777] #I #[fg=#637777]#[fg=#d6deeb] #{?window_zoomed_flag,󰍇 ,}#W #[fg=#0d2137]"

set -g window-status-current-format "#[bg=#1d3b53,fg=#c792ea,bold] #I #[fg=#c792ea]#[fg=#d6deeb,bold] #{?window_zoomed_flag,󰍇 ,}#W #[fg=#1d3b53]"

set -g window-status-activity-style "bg=#0d2137,fg=#ffcb8b,bold"
set -g window-status-bell-style     "bg=#0d2137,fg=#ff5874,bold"

# =============================================================================
# Panes
# =============================================================================

set -g pane-border-style        "fg=#1d3b53"
set -g pane-active-border-style "fg=#7fdbca"
set -g display-panes-colour        "#637777"
set -g display-panes-active-colour "#7fdbca"
set -g display-panes-time 800

# =============================================================================
# Messages / Command Line
# =============================================================================

set -g message-style         "bg=#1e4063,fg=#ffcb8b,bold"
set -g message-command-style "bg=#1e4063,fg=#c792ea"

# =============================================================================
# Clock / Copy Mode
# =============================================================================

set -g clock-mode-colour "#82aaff"
set -g clock-mode-style 24
set -g mode-style "bg=#1e4063,fg=#7fdbca,bold"

# =============================================================================
# Miscellaneous
# =============================================================================

set -g set-titles on
set -g set-titles-string "#W"

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
